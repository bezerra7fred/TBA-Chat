name: TBA frontend build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tba-frontend-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'bezerra7fred/TBA-Chat'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      HUSKY: '0'
      RAILS_ENV: production
      VITE_RUBY_ENV: production
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install locked build dependencies
        run: pnpm install --frozen-lockfile

      - name: Test message formatting and conversation filtering
        run: >-
          pnpm exec vitest run
          app/javascript/shared/helpers/specs/MessageFormatter.spec.js
          app/javascript/dashboard/store/modules/specs/conversations/helpers.spec.js
          app/javascript/dashboard/store/modules/specs/conversations/getters.spec.js
          --maxWorkers=2
        env:
          RAILS_ENV: test
          NODE_ENV: test
          TZ: UTC

      - name: Build app and SDK without starting Rails
        run: |
          pnpm exec vite build --mode production
          pnpm run build:sdk

      - name: Validate and package compiled files
        run: python3 script/tba/package_frontend.py

      - uses: actions/upload-artifact@v4
        with:
          name: tba-frontend-${{ github.sha }}
          path: |
            dist/tba-frontend-*.tar.gz
            dist/tba-frontend-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Summarize
        run: |
          echo '### Compiled frontend (not deployed)' >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'Artifact retention: 1 day. No production secrets or server access used.' >> "$GITHUB_STEP_SUMMARY"
          cat dist/*.sha256 >> "$GITHUB_STEP_SUMMARY"
