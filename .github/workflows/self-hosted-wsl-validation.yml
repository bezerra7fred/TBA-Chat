name: Validate PR on Self-Hosted WSL Runner

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to validate (default: d099034 - PR #8 customizations)'
        default: 'd099034'
        required: false

jobs:
  validate:
    runs-on: [self-hosted, linux, x64, tba-chat-wsl]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch || 'd099034' }}

      - name: Detect gateway IP (once, shared across steps)
        id: gateway
        run: |
          GATEWAY=$(ip route show default | awk '{print $3; exit}')
          echo "gateway_ip=$GATEWAY" >> $GITHUB_OUTPUT

      - name: Setup Node.js + pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install pnpm via corepack
        run: corepack enable && pnpm --version

      - name: Cache pnpm modules
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Vite test assets
        run: pnpm exec vite build --mode test 2>&1 || exit $?

      - name: Run focused vitest specs (exit code preserved)
        env:
          TZ: UTC
          CI: true
        run: pnpm exec vitest run --no-coverage --reporter=verbose 2>&1 || exit $?

      - name: Setup Ruby + gems via ruby/setup-ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.4
          bundler: true
        env:
          GEM_HOME: /home/fredav/.rbenv/versions/3.4.4/lib/ruby/gems/3.4.0
          BUNDLE_GEMFILE: Gemfile

      - name: Bundle install (exit code preserved)
        run: bundle config set --local deployment 'true' && bundle install --jobs 4 --retry 3 2>&1 || exit $?

      - name: Derive gateway IP and setup DB (same shell, no env vars leaked)
        env:
          GATEWAY_IP: ${{ steps.gateway.outputs.gateway_ip }}
        run: |
          set -e
          GATEWAY=$GATEWAY_IP
          echo "Using gateway: $GATEWAY"
          # Derive POSTGRES_HOST and REDIS_URL from gateway
          export POSTGRES_HOST=$GATEWAY
          export POSTGRES_PORT='5432'
          export POSTGRES_USERNAME=postgres
          export POSTGRES_PASSWORD=postgres
          export POSTGRES_DATABASE=test_validator_${{ github.run_id }}
          export REDIS_URL=redis://${GATEWAY}:6379/1
          # Create DB and schema
          bundle exec rails db:create db:schema:load 2>&1 || exit $?
          # Verify Redis DB is usable (PING + SELECT 1)
          redis-cli -u $REDIS_URL PING 2>&1 || exit $?

      - name: Validate rspec specs exist (no shared DB assumed)
        run: test -f spec/controllers/api/v1/accounts_controller_spec.rb && test -f spec/controllers/dashboard_custom_domain_spec.rb || exit $?

      - name: Run rspec subset (exit code preserved, isolated env with gateway)
        env:
          RAILS_ENV: test
          POSTGRES_HOST: ${{ steps.gateway.outputs.gateway_ip }}
          POSTGRES_PORT: '5432'
          POSTGRES_USERNAME: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DATABASE: test_validator_${{ github.run_id }}
          REDIS_URL: redis://${{ steps.gateway.outputs.gateway_ip }}:6379/1
          SECRET_KEY_BASE: localvalidation1234567890abcdef1234567890abcdef
        run: bundle exec rspec spec/controllers/api/v1/accounts_controller_spec.rb spec/controllers/dashboard_custom_domain_spec.rb --format progress 2>&1 || exit $?