name: Validate PR on Self-Hosted WSL Runner

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to validate (default: head of reactions-validation-2)'
        default: 'ac33c0e'
        required: false

jobs:
  frontend-tests:
    runs-on: [self-hosted, linux, x64, tba-chat-wsl]
    defaults:
      run:
        working-directory: ./app/javascript
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch || 'ac33c0e' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run vitest frontend tests
        run: TZ=UTC npx vitest run --no-coverage

  backend-smoke:
    runs-on: [self-hosted, linux, x64, tba-chat-wsl]
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch || 'ac33c0e' }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.4
          bundler: true

      - name: Install gems
        run: bundle config set --local deployment 'true' && bundle install --jobs 4 --retry 3

      - name: Run database setup
        env:
          RAILS_ENV: test
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
          POSTGRES_USERNAME: postgres
          POSTGRES_PASSWORD: postgres
          REDIS_URL: redis://127.0.0.1:6379
          SECRET_KEY_BASE: localvalidation123
        run: bundle exec rails db:create db:schema:load 2>&1 | tail -5

      - name: Run rspec backend tests (subset)
        env:
          RAILS_ENV: test
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
          POSTGRES_USERNAME: postgres
          POSTGRES_PASSWORD: postgres
          REDIS_URL: redis://127.0.0.1:6379
          SECRET_KEY_BASE: localvalidation123
        run: bundle exec rspec spec/controllers/api/v1/accounts_controller_spec.rb spec/controllers/dashboard_custom_domain_spec.rb --format progress 2>&1 | tail -20