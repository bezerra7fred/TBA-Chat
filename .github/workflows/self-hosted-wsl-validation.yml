name: Validate PR on Self-Hosted WSL Runner

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to validate (default: d099034 - PR #8 customizations)'
        default: 'd099034'
        required: false

jobs:
  lint:
    runs-on: [self-hosted, linux, x64, tba-chat-wsl]
    defaults:
      run:
        working-directory: ./
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch || 'd099034' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm exec eslint . || true

      - name: Run RuboCop
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.4
        env:
          GEM_HOME: /home/fredav/.rbenv/versions/3.4.4/lib/ruby/gems/3.4.0
      - run: bundle exec rubocop -D 2>&1 | tail -n 20 || true

      - name: Run bundle-audit check
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.4
        env:
          GEM_HOME: /home/fredav/.rbenv/versions/3.4.4/lib/ruby/gems/3.4.0
      - run: bundle audit check --update 2>&1 || true

      - name: Build Vite test assets
        run: pnpm exec vite build --mode test || true

  frontend-tests:
    runs-on: [self-hosted, linux, x64, tba-chat-wsl]
    defaults:
      run:
        working-directory: ./app/javascript
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch || 'd099034' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run focused vitest specs
        env:
          TZ: UTC
          CI: true
        run: pnpm exec vitest run --no-coverage --reporter=verbose 2>&1 | tail -n 30 || true

  backend-smoke:
    runs-on: [self-hosted, linux, x64, tba-chat-wsl]
    defaults:
      run:
        working-directory: ./
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch || 'd099034' }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.4
        env:
          GEM_HOME: /home/fredav/.rbenv/versions/3.4.4/lib/ruby/gems/3.4.0
      - name: Install gems
        run: bundle config set --local deployment 'true' && bundle install --jobs 4 --retry 3 2>&1 | tail -n 5 || true
      - name: Run rspec backend subset (2 specs)
        env:
          RAILS_ENV: test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USERNAME: postgres
          POSTGRES_PASSWORD: postgres
          REDIS_URL: redis://localhost:6379
          SECRET_KEY_BASE: localvalidation1234567890abcdef1234567890abcdef
        run: bundle exec rspec spec/controllers/api/v1/accounts_controller_spec.rb spec/controllers/dashboard_custom_domain_spec.rb --format progress 2>&1 | tail -n 20 || true