version: 2.1

orbs:
  node: circleci/node@7.2.1

commands:
  install-ruby-dependencies:
    steps:
      - run:
          name: Select the repository Bundler version
          command: gem install bundler -v 2.5.16 --no-document
      - run:
          name: Configure Bundler cache path
          command: bundle config set path vendor/bundle
      - restore_cache:
          keys:
            - bundler-v1-{{ checksum "Gemfile.lock" }}
      - run:
          name: Install Ruby dependencies
          command: bundle _2.5.16_ install --jobs 4 --retry 3
      - save_cache:
          key: bundler-v1-{{ checksum "Gemfile.lock" }}
          paths:
            - vendor/bundle

  install-node-dependencies:
    steps:
      - node/install:
          node-version: "24.22.1"
      - restore_cache:
          keys:
            - pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
      - run:
          name: Install pnpm and JavaScript dependencies
          environment:
            PNPM_HOME: /home/circleci/.local/share/pnpm
          command: |
            { curl -fsSL https://get.pnpm.io/ -o /tmp/pnpm-install.sh \
              || curl -fsSL https://github.com/pnpm/get.pnpm.io/releases/latest/download/install.sh -o /tmp/pnpm-install.sh; } \
              && sh /tmp/pnpm-install.sh
            echo 'export PATH="/home/circleci/.local/share/pnpm/bin:$PATH"' >> "$BASH_ENV"
            export PATH="/home/circleci/.local/share/pnpm/bin:$PATH"
            "$PNPM_HOME/bin/pnpm" config set store-dir .pnpm-store
            pnpm install --frozen-lockfile
      - save_cache:
          key: pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - .pnpm-store

jobs:
  frontend-checks:
    docker:
      - image: cimg/ruby:3.4.4-node
    resource_class: medium
    steps:
      - checkout
      - install-node-dependencies
      - run:
          name: Run ESLint
          command: pnpm run eslint
      - run:
          name: Run frontend tests
          command: pnpm run test:coverage

  backend-lint:
    docker:
      - image: cimg/ruby:3.4.4-node
    resource_class: medium
    steps:
      - checkout
      - install-ruby-dependencies
      - run:
          name: Run RuboCop
          command: bundle exec rubocop --parallel

  security-audit:
    docker:
      - image: cimg/ruby:3.4.4-node
    resource_class: medium
    steps:
      - checkout
      - install-ruby-dependencies
      - run:
          name: Check Ruby dependencies for known vulnerabilities
          command: |
            bundle exec bundle-audit update
            bundle exec bundle-audit check

  backend-test-assets:
    docker:
      - image: cimg/ruby:3.4.4-node
    resource_class: large
    environment:
      RAILS_ENV: test
      NODE_OPTIONS: --openssl-legacy-provider --max-old-space-size=5120
    steps:
      - checkout
      - install-ruby-dependencies
      - install-node-dependencies
      - run:
          name: Build Vite test assets
          command: bin/vite build --clear --mode=test
      - persist_to_workspace:
          root: .
          paths:
            - public/vite-test

  backend-tests:
    docker:
      - image: cimg/ruby:3.4.4-node
      - image: pgvector/pgvector:pg16
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ""
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
      - image: redis:7-alpine
    environment:
      RAILS_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: ""
      REDIS_URL: redis://localhost:6379
      VITE_RUBY_AUTO_BUILD: "false"
    parallelism: 16
    resource_class: medium
    steps:
      - checkout
      - install-ruby-dependencies
      - attach_workspace:
          at: .
      - run:
          name: Wait for PostgreSQL and Redis
          command: |
            wait_for_port() {
              local port="$1"
              for attempt in $(seq 1 60); do
                if timeout 1 bash -c ":</dev/tcp/127.0.0.1/$port" 2>/dev/null; then
                  return 0
                fi
                sleep 1
              done
              return 1
            }
            wait_for_port 5432
            wait_for_port 6379
      - run:
          name: Create and prepare database
          command: |
            bundle exec rake db:create
            bundle exec rake db:schema:load
      - run:
          name: Run backend tests
          command: |
            mkdir -p tmp/test-results
            mapfile -t spec_files < <(find spec -name '*_spec.rb' | sort)
            shard_specs=()
            for index in "${!spec_files[@]}"; do
              if (( index % CIRCLE_NODE_TOTAL == CIRCLE_NODE_INDEX )); then
                shard_specs+=("${spec_files[index]}")
              fi
            done
            if (("${#shard_specs[@]}" > 0)); then
              bundle exec rspec --profile=10 --format progress --format RspecJunitFormatter \
                --out tmp/test-results/rspec-${CIRCLE_NODE_INDEX}.xml "${shard_specs[@]}"
            fi
      - when:
          condition: always
          steps:
            - store_test_results:
                path: tmp/test-results
            - store_artifacts:
                path: log
                destination: rails-logs

workflows:
  test-and-lint:
    jobs:
      - frontend-checks
      - backend-lint
      - security-audit
      - backend-test-assets
      - backend-tests:
          requires:
            - backend-test-assets
